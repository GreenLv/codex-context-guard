name: PR validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify exact diff
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      gates: ${{ steps.select.outputs.gates }}
      invalidates: ${{ steps.select.outputs.invalidates }}
      full_required: ${{ steps.select.outputs.full_required }}
      profile: ${{ steps.profile.outputs.profile }}
      base: ${{ steps.profile.outputs.base }}
      head: ${{ steps.profile.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Test selection and summary contracts
        run: python -m unittest tests.test_validation_selection tests.test_required_jobs tests.test_selected_validation
      - name: Classify exact diff
        id: select
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python tools/validation/select_validation.py \
            --repo-root . \
            --base "$EVENT_BASE_SHA" \
            --head "$EVENT_HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Classify the same diff for platform coverage
        id: profile
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m tools.validation.ci_policy select --profile auto --base "$EVENT_BASE_SHA" --head "$EVENT_HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  selected_validation:
    name: Selected validation
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "uv==0.12.18"
      - name: Install locked validation tools
        run: |
          set -euo pipefail
          uv sync --locked --only-group validation
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run repository-owned selected gates
        if: needs.classify.outputs.profile == 'tests' || (needs.classify.outputs.profile == 'daily' && !contains(needs.classify.outputs.gates, 'focused_tests'))
        env:
          VALIDATION_PLAN: ${{ needs.classify.outputs.plan }}
        run: python tools/validation/run_selected_validation.py --plan-json "$VALIDATION_PLAN" --repo-root .

      - name: Run conservative full candidate gates
        if: needs.classify.outputs.profile == 'full' || (needs.classify.outputs.profile == 'daily' && contains(needs.classify.outputs.gates, 'focused_tests'))
        run: python tools/validation/run_selected_validation.py --plan-json '{"schema":"change-scoped-validation-plan/v1","gates":["full_candidate"],"changed_paths":[]}' --repo-root .

  selected_ubuntu_py310:
    name: Ubuntu selected / Python 3.10
    needs: classify
    if: needs.classify.outputs.profile == 'tests'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.10"
      suite: selected
      base-sha: ${{ needs.classify.outputs.base }}
      head-sha: ${{ needs.classify.outputs.head }}

  selected_ubuntu_py314:
    name: Ubuntu selected / Python 3.14
    needs: classify
    if: needs.classify.outputs.profile == 'tests'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.14"
      suite: selected
      base-sha: ${{ needs.classify.outputs.base }}
      head-sha: ${{ needs.classify.outputs.head }}

  selected_macos_py312:
    name: macOS selected / Python 3.12
    needs: classify
    if: needs.classify.outputs.profile == 'tests'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.12"
      suite: selected
      base-sha: ${{ needs.classify.outputs.base }}
      head-sha: ${{ needs.classify.outputs.head }}

  selected_windows_py312:
    name: Windows selected / Python 3.12
    needs: classify
    if: needs.classify.outputs.profile == 'tests'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.12"
      suite: selected
      base-sha: ${{ needs.classify.outputs.base }}
      head-sha: ${{ needs.classify.outputs.head }}

  required:
    name: PR validation required
    if: always()
    needs: [classify, selected_validation, selected_ubuntu_py310, selected_ubuntu_py314, selected_macos_py312, selected_windows_py312]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fail closed over required jobs
        env:
          CI_PROFILE: ${{ needs.classify.outputs.profile }}
          ALL_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python -m tools.validation.ci_policy verify-pr --profile "$CI_PROFILE" --needs-json "$ALL_NEEDS"
