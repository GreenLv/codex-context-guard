name: Windows ACL diagnosis

on:
  push:
    branches: [codex/0.15.1-hook-repair]
    paths:
      - .github/workflows/windows-acl-diagnostic.yml
      - tools/validation/acl_ci_diagnostic.py
      - tests/test_acl_ci_diagnostic.py
      - tests/test_incident_acl_family.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Fixed ACL node / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check "uv==0.12.18"
      - name: Run original strict ACL node with redacted failure structure
        run: uv run --locked --only-group test --python python python -B -m tools.validation.acl_ci_diagnostic
