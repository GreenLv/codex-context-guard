name: CI lane

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        type: string
      python-version:
        description: Python version for this independent lane
        required: true
        type: string

      suite:
        description: Full behavior or bounded Windows platform checks
        required: false
        type: string
        default: full

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.runner }} / Python ${{ inputs.python-version }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install locked test tools
        run: python -m pip install --disable-pip-version-check "uv==0.12.18"
      - name: Validate suite selection
        env:
          CI_SUITE: ${{ inputs.suite }}
        run: python -c "import os; assert os.environ['CI_SUITE'] in ('full', 'windows-platform')"
      - name: Run Windows platform regressions
        if: inputs.suite == 'windows-platform'
        run: uv run --locked --only-group test --python python python -m tools.validation.run_windows_platform_suite
      - name: Run current-behavior regression tests
        if: inputs.suite == 'full'
        run: uv run --locked --only-group test --python python python scripts/run_current_behavior_suite.py
      - name: Audit historical phase 3 transition
        if: inputs.suite == 'full'
        run: uv run --locked --only-group test --python python python scripts/check_phase3_transition.py
      - name: Run nine-Hook source self-test
        run: uv run --locked --only-group test --python python python scripts/context_guard.py self-test
