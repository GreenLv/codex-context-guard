name: CI lane

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        type: string
      python-version:
        description: Python version for this independent lane
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.runner }} / Python ${{ inputs.python-version }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Audit candidate commit identities
        env:
          CONTEXT_GUARD_IDENTITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CONTEXT_GUARD_IDENTITY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/audit_commit_identity.py .
      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.1"
      - name: Validate repository contract
        run: python scripts/validate_public_repo.py .
      - name: Audit public tree
        run: python scripts/audit_public_tree.py .
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run eight-Hook source self-test
        run: python scripts/context_guard.py self-test
      - name: Lint
        run: ruff check .
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
