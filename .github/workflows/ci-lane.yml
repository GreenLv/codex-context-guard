name: CI lane

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        type: string
      python-version:
        description: Python version for this independent lane
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.runner }} / Python ${{ inputs.python-version }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run eight-Hook source self-test
        run: python scripts/context_guard.py self-test
