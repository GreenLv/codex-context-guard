name: HOL Plugin Scanner

on:
  workflow_dispatch:
    inputs:
      refresh_registry:
        description: "Submit the current scan metadata to HOL for registry refresh"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@46ad86451b45941cd853a03ee6ccdb55f3dbee28 # v1.2.683
        with:
          plugin_dir: "."
          mode: scan
          install_cisco: true
          cisco_skill_scan: "on"
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
          registry_payload_output: hol-registry-payload.json
          submission_enabled: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_registry }}
          submission_token: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_registry && secrets.AWESOME_CODEX_PLUGINS_TOKEN || '' }}
