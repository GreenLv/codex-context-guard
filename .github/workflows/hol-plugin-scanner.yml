name: HOL Plugin Scanner

on:
  workflow_dispatch:
    inputs:
      refresh_registry:
        description: "Submit the current scan metadata to HOL for registry refresh"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: HOL Plugin Scanner
        id: scanner
        uses: hashgraph-online/ai-plugin-scanner-action@d777b580805f6fadb19a03f84daf0974c53c6d38 # v1.2.786
        with:
          plugin_dir: "."
          mode: scan
          install_cisco: true
          cisco_skill_scan: "on"
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
          output: ai-plugin-scanner.sarif
          registry_payload_output: hol-registry-payload.json
          submission_enabled: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_registry }}
          submission_token: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_registry && secrets.AWESOME_CODEX_PLUGINS_TOKEN || '' }}
      - name: Bind retained reports to checkout identity
        id: evidence
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SCANNER_OUTCOME: ${{ steps.scanner.outcome }}
        run: |
          set -euo pipefail
          python -B tools/validation/hol_evidence.py \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-repository "$SOURCE_REPOSITORY" \
            --expected-scanner-version "3.43.1" \
            --scanner-outcome "$SCANNER_OUTCOME" >> "$GITHUB_OUTPUT"
      - name: Retain original HOL reports and repository evidence
        if: ${{ always() && steps.evidence.outputs.companion_path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hol-scan-evidence-${{ github.sha }}
          path: |
            ${{ steps.evidence.outputs.companion_path }}
            ${{ steps.evidence.outputs.sarif_path }}
            ${{ steps.evidence.outputs.payload_path }}
          if-no-files-found: error
          retention-days: 30
