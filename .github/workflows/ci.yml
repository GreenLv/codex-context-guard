name: Windows candidate configuration stages (diagnosis only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    name: Fixed 1178 candidate configuration stages / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1178b1426254654cff4ab84d1dd2dff33c6de3d6
          path: subject
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "uv==0.12.18"
      - name: One instrumented candidate, original trace off, not acceptance
        working-directory: subject
        shell: pwsh
        run: |
          uv run --locked --only-group test --python python python -B `
            ../diagnostic/tools/validation/hook_stage_ci_diagnostic.py `
            --subject-root . --original-trace off `
            --output "$env:RUNNER_TEMP/candidate-config-stages.json" 2>$null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: candidate-config-stages
          path: |
            ${{ runner.temp }}/candidate-config-stages.json
            ${{ runner.temp }}/cg-hook-stage-diagnostic-*/stages.jsonl
          if-no-files-found: warn
          retention-days: 7
