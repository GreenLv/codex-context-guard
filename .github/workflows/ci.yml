name: Integrated Windows reader qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: adabfb78bec2f5c640590d4fa8766c1bb8efd2ad
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "uv==0.12.18"
      - name: Original Windows reader and Hook tests
        shell: pwsh
        run: |
          uv run --locked --only-group test --python python python -B -m pytest -q `
            tests/test_windows_identity_reader.py tests/test_cg0151_readonly_snapshot.py `
            tests/test_marketplace_artifact.py::MarketplaceArtifactTests::test_real_hook_does_not_generate_bytecode_or_break_full_parity `
            --junitxml="$env:RUNNER_TEMP/windows-reader-focused.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-reader-focused
          path: ${{ runner.temp }}/windows-reader-focused.xml
          retention-days: 7
