name: Candidate CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Full or risk-selected daily coverage
        type: choice
        options: [full, daily]
        default: full
      base_sha:
        description: Full baseline commit SHA (required for daily dispatch)
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  classify:
    name: Classify candidate bytes
    runs-on: ubuntu-latest
    outputs:
      invalidates: ${{ steps.select.outputs.invalidates }}
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT_BASE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git hash-object -t tree /dev/null)"
          fi
          python tools/validation/select_validation.py --repo-root . --base "$base_sha" --head "$EVENT_HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - id: profile
        env:
          EVENT_BASE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          REQUESTED_PROFILE: ${{ inputs.profile || 'auto' }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          base_sha="$EVENT_BASE_SHA"
          if [[ "$REQUESTED_PROFILE" == daily ]]; then
            [[ "$DISPATCH_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$(git rev-parse "$DISPATCH_BASE_SHA^{commit}")" == "$DISPATCH_BASE_SHA" ]]
            git merge-base --is-ancestor "$DISPATCH_BASE_SHA" "$EVENT_HEAD_SHA"
            [[ "$DISPATCH_BASE_SHA" != "$EVENT_HEAD_SHA" ]]
            base_sha="$DISPATCH_BASE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git hash-object -t tree /dev/null)"
          fi
          python -m tools.validation.ci_policy select --profile "$REQUESTED_PROFILE" --base "$base_sha" --head "$EVENT_HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  static:
    name: Identity, repository, privacy, lint, and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Audit candidate commit identities
        env:
          CONTEXT_GUARD_IDENTITY_BASE: ${{ github.event.before }}
          CONTEXT_GUARD_IDENTITY_HEAD: ${{ github.sha }}
        run: python scripts/audit_commit_identity.py .
      - run: python -m pip install --disable-pip-version-check "uv==0.12.18"
      - name: Install locked validation tools
        run: |
          set -euo pipefail
          uv sync --locked --only-group validation
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python scripts/validate_public_repo.py .
      - run: python tools/validation/validate_workflows.py .
      - run: python scripts/audit_public_tree.py .
      - run: ruff check .
      - run: python -m compileall -q scripts tests tools
      - name: Check candidate commit whitespace
        run: git diff-tree --check --root -r HEAD

  ci_reuse:
    name: Exact-commit candidate run reuse
    needs: classify
    if: needs.classify.outputs.profile == 'full'
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Evaluate reuse of a passed full run on this exact commit
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          CG_REPO: ${{ github.repository }}
          CG_COMMIT: ${{ github.sha }}
          CG_RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          verdict="run"
          if python tools/validation/ci_reuse.py --repo "$CG_REPO" --commit "$CG_COMMIT" --current-run "$CG_RUN_ID" --output "$RUNNER_TEMP/ci-reuse-evidence.json"; then
            verdict="confirmed"
          fi
          echo "reuse=$verdict" >> "$GITHUB_OUTPUT"
      - name: Upload exact-commit reuse evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reuse-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-reuse-evidence.json
          if-no-files-found: warn
          retention-days: 30

  ubuntu_py310:
    name: Ubuntu / Python 3.10
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.10"

  ubuntu_py311:
    name: Ubuntu / Python 3.11
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.11"

  ubuntu_py312:
    name: Ubuntu / Python 3.12
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.12"

  ubuntu_py313:
    name: Ubuntu / Python 3.13
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.13"

  ubuntu_py314:
    name: Ubuntu / Python 3.14
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.14"

  macos_py310:
    name: macOS / Python 3.10
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.10"

  macos_py311:
    name: macOS / Python 3.11
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.11"

  macos_py312:
    name: macOS / Python 3.12
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.12"

  macos_py313:
    name: macOS / Python 3.13
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.13"

  macos_py314:
    name: macOS / Python 3.14
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.14"

  windows_py310:
    name: Windows / Python 3.10
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.10"

  windows_py311:
    name: Windows / Python 3.11
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.11"

  windows_py312:
    name: Windows / Python 3.12
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.12"

  windows_py313:
    name: Windows / Python 3.13
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.13"

  windows_py314:
    name: Windows / Python 3.14
    needs: [classify, ci_reuse]
    if: needs.classify.outputs.profile != 'full' || needs.ci_reuse.outputs.reuse != 'confirmed'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.14"

  windows_platform_py310:
    name: Windows platform / Python 3.10
    needs: classify
    if: needs.classify.outputs.profile == 'daily'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.10"
      suite: windows-platform

  windows_platform_py314:
    name: Windows platform / Python 3.14
    needs: classify
    if: needs.classify.outputs.profile == 'daily'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.14"
      suite: windows-platform

  portable_windows:
    name: Windows portable installed-runtime acceptance
    needs: [classify, static, ci_reuse]
    if: needs.ci_reuse.outputs.reuse != 'confirmed' && (needs.classify.outputs.profile == 'full' || contains(needs.classify.outputs.invalidates, 'native_artifact') || contains(needs.classify.outputs.invalidates, 'native_runtime'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install --global @openai/codex@0.158.0
      - name: Preflight versioned portable acceptance
        shell: pwsh
        run: |
          python tools/validation/native_acceptance.py `
            --source-commit "${{ github.sha }}" `
            --output "$env:RUNNER_TEMP/native-acceptance-windows.json" `
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            --preflight
      - name: Run versioned portable acceptance entrypoint
        id: portable_acceptance
        shell: pwsh
        run: |
          python tools/validation/native_acceptance.py `
            --source-commit "${{ github.sha }}" `
            --output "$env:RUNNER_TEMP/native-acceptance-windows.json" `
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Diagnose private DACL after portable acceptance failure
        if: failure() && steps.portable_acceptance.outcome == 'failure'
        shell: pwsh
        run: python tools/validation/diagnose_windows_private_dacl.py 2>$null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-acceptance-windows-${{ github.sha }}
          path: ${{ runner.temp }}/native-acceptance-windows.json
          if-no-files-found: error
          retention-days: 30

  required:
    name: Candidate CI required
    if: always()
    needs:
      - classify
      - static
      - ci_reuse
      - ubuntu_py310
      - ubuntu_py311
      - ubuntu_py312
      - ubuntu_py313
      - ubuntu_py314
      - macos_py310
      - macos_py311
      - macos_py312
      - macos_py313
      - macos_py314
      - windows_py310
      - windows_py311
      - windows_py312
      - windows_py313
      - windows_py314
      - windows_platform_py310
      - windows_platform_py314
      - portable_windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fail closed over the selected required lanes
        env:
          CI_PROFILE: ${{ needs.classify.outputs.profile }}
          ALL_NEEDS: ${{ toJSON(needs) }}
          REUSE_CONFIRMED: ${{ needs.classify.outputs.profile == 'full' && needs.ci_reuse.outputs.reuse == 'confirmed' }}
          PORTABLE_REQUIRED: ${{ needs.ci_reuse.outputs.reuse != 'confirmed' && (needs.classify.outputs.profile == 'full' || contains(needs.classify.outputs.invalidates, 'native_artifact') || contains(needs.classify.outputs.invalidates, 'native_runtime')) }}
        run: python -m tools.validation.ci_policy verify --profile "$CI_PROFILE" --portable "$PORTABLE_REQUIRED" --reuse "$REUSE_CONFIRMED" --needs-json "$ALL_NEEDS"

  release_artifact:
    name: Manifest-exact candidate artifact
    needs: required
    if: ${{ !cancelled() && needs.required.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.profile == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Build and bind the canonical candidate ZIP
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import zipfile

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          sys.path.insert(0, str(root / "tools" / "validation"))
          from build_release_artifact import build
          from acceptance_identity import runtime_tree_digest

          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if source != os.environ["GITHUB_SHA"] or subprocess.check_output(
                  ["git", "status", "--porcelain", "--untracked-files=all"]):
              raise SystemExit("candidate source is not the clean workflow commit")
          version = json.loads((root / ".codex-plugin/plugin.json").read_text())["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("candidate version is not a stable numeric version")
          output = Path(os.environ["RUNNER_TEMP"]) / "context-guard-artifact"
          output.mkdir()
          archive = output / f"context-guard-{version}.zip"
          repeat = output / "repeat.zip"
          build(root, archive)
          build(root, repeat)
          body = archive.read_bytes()
          if body != repeat.read_bytes():
              raise SystemExit("repeat pack differs from candidate ZIP")
          repeat.unlink()
          with zipfile.ZipFile(archive) as zipped:
              count = len(zipped.namelist())
          receipt = {
              "schema": "cg-candidate-artifact/v1", "source_commit": source,
              "runtime_tree_sha256": runtime_tree_digest(root),
              "filename": archive.name, "sha256": hashlib.sha256(body).hexdigest(),
              "size_bytes": len(body), "file_count": count, "repeat_pack_equal": True,
          }
          (output / "artifact.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: context-guard-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/context-guard-artifact/
          if-no-files-found: error
          retention-days: 30
