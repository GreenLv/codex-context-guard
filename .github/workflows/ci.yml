name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu_py310:
    name: Ubuntu / Python 3.10
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.10"

  ubuntu_py311:
    name: Ubuntu / Python 3.11
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.11"

  ubuntu_py312:
    name: Ubuntu / Python 3.12
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.12"

  ubuntu_py313:
    name: Ubuntu / Python 3.13
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.13"

  macos_py310:
    name: macOS / Python 3.10
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.10"

  macos_py311:
    name: macOS / Python 3.11
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.11"

  macos_py312:
    name: macOS / Python 3.12
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.12"

  macos_py313:
    name: macOS / Python 3.13
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.13"

  windows_py310:
    name: Windows / Python 3.10
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.10"

  windows_py311:
    name: Windows / Python 3.11
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.11"

  windows_py312:
    name: Windows / Python 3.12
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.12"

  windows_py313:
    name: Windows / Python 3.13
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.13"
