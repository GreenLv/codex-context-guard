name: Candidate CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Full is required for release; daily is for routine coverage
        type: choice
        options: [full, daily]
        default: full

permissions:
  contents: read

jobs:
  classify:
    name: Classify candidate bytes
    runs-on: ubuntu-latest
    outputs:
      invalidates: ${{ steps.select.outputs.invalidates }}
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT_BASE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git hash-object -t tree /dev/null)"
          fi
          python tools/validation/select_validation.py --repo-root . --base "$base_sha" --head "$EVENT_HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - id: profile
        env:
          EVENT_BASE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          REQUESTED_PROFILE: ${{ inputs.profile || 'auto' }}
        run: |
          set -euo pipefail
          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git hash-object -t tree /dev/null)"
          fi
          python -m tools.validation.ci_policy select --profile "$REQUESTED_PROFILE" --base "$base_sha" --head "$EVENT_HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  static:
    name: Identity, repository, privacy, lint, and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Audit candidate commit identities
        env:
          CONTEXT_GUARD_IDENTITY_BASE: ${{ github.event.before }}
          CONTEXT_GUARD_IDENTITY_HEAD: ${{ github.sha }}
        run: python scripts/audit_commit_identity.py .
      - run: python -m pip install --disable-pip-version-check "uv==0.12.18"
      - name: Install locked validation tools
        run: |
          set -euo pipefail
          uv sync --locked --only-group validation
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python scripts/validate_public_repo.py .
      - run: python tools/validation/validate_workflows.py .
      - run: python scripts/audit_public_tree.py .
      - run: ruff check .
      - run: python -m compileall -q scripts tests tools
      - name: Check candidate commit whitespace
        run: git diff-tree --check --root -r HEAD

  ubuntu_py310:
    name: Ubuntu / Python 3.10
    needs: classify
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.10"

  ubuntu_py311:
    name: Ubuntu / Python 3.11
    needs: classify
    if: needs.classify.outputs.profile == 'full'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.11"

  ubuntu_py312:
    name: Ubuntu / Python 3.12
    needs: classify
    if: needs.classify.outputs.profile == 'full'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.12"

  ubuntu_py313:
    name: Ubuntu / Python 3.13
    needs: classify
    if: needs.classify.outputs.profile == 'full'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.13"

  ubuntu_py314:
    name: Ubuntu / Python 3.14
    needs: classify
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: ubuntu-latest
      python-version: "3.14"

  macos_py310:
    name: macOS / Python 3.10
    needs: classify
    if: needs.classify.outputs.profile == 'full'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.10"

  macos_py311:
    name: macOS / Python 3.11
    needs: classify
    if: needs.classify.outputs.profile == 'full'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.11"

  macos_py312:
    name: macOS / Python 3.12
    needs: classify
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.12"

  macos_py313:
    name: macOS / Python 3.13
    needs: classify
    if: needs.classify.outputs.profile == 'full'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.13"

  macos_py314:
    name: macOS / Python 3.14
    needs: classify
    if: needs.classify.outputs.profile == 'full'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: macos-latest
      python-version: "3.14"

  windows_py310:
    name: Windows / Python 3.10
    needs: classify
    if: needs.classify.outputs.profile == 'full'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.10"

  windows_py311:
    name: Windows / Python 3.11
    needs: classify
    if: needs.classify.outputs.profile == 'full'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.11"

  windows_py312:
    name: Windows / Python 3.12
    needs: classify
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.12"

  windows_py313:
    name: Windows / Python 3.13
    needs: classify
    if: needs.classify.outputs.profile == 'full'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.13"

  windows_py314:
    name: Windows / Python 3.14
    needs: classify
    if: needs.classify.outputs.profile == 'full'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.14"

  windows_platform_py310:
    name: Windows platform / Python 3.10
    needs: classify
    if: needs.classify.outputs.profile == 'daily'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.10"
      suite: windows-platform

  windows_platform_py314:
    name: Windows platform / Python 3.14
    needs: classify
    if: needs.classify.outputs.profile == 'daily'
    uses: ./.github/workflows/ci-lane.yml
    with:
      runner: windows-latest
      python-version: "3.14"
      suite: windows-platform

  portable_windows:
    name: Windows portable installed-runtime acceptance
    needs: [classify, static]
    if: needs.classify.outputs.profile == 'full' || contains(needs.classify.outputs.invalidates, 'native_artifact') || contains(needs.classify.outputs.invalidates, 'native_runtime')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install --global @openai/codex@0.158.0
      - name: Preflight versioned portable acceptance
        shell: pwsh
        run: |
          python tools/validation/native_acceptance.py `
            --source-commit "${{ github.sha }}" `
            --output "$env:RUNNER_TEMP/native-acceptance-windows.json" `
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            --preflight
      - name: Run versioned portable acceptance entrypoint
        shell: pwsh
        run: |
          python tools/validation/native_acceptance.py `
            --source-commit "${{ github.sha }}" `
            --output "$env:RUNNER_TEMP/native-acceptance-windows.json" `
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-acceptance-windows-${{ github.sha }}
          path: ${{ runner.temp }}/native-acceptance-windows.json
          if-no-files-found: error
          retention-days: 30

  required:
    name: Candidate CI required
    if: always()
    needs:
      - classify
      - static
      - ubuntu_py310
      - ubuntu_py311
      - ubuntu_py312
      - ubuntu_py313
      - ubuntu_py314
      - macos_py310
      - macos_py311
      - macos_py312
      - macos_py313
      - macos_py314
      - windows_py310
      - windows_py311
      - windows_py312
      - windows_py313
      - windows_py314
      - windows_platform_py310
      - windows_platform_py314
      - portable_windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fail closed over the selected required lanes
        env:
          CI_PROFILE: ${{ needs.classify.outputs.profile }}
          ALL_NEEDS: ${{ toJSON(needs) }}
          PORTABLE_REQUIRED: ${{ needs.classify.outputs.profile == 'full' || contains(needs.classify.outputs.invalidates, 'native_artifact') || contains(needs.classify.outputs.invalidates, 'native_runtime') }}
        run: python -m tools.validation.ci_policy verify --profile "$CI_PROFILE" --portable "$PORTABLE_REQUIRED" --needs-json "$ALL_NEEDS"
