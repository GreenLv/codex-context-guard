name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check ruff
      - name: Validate repository contract
        run: python scripts/validate_public_repo.py .
      - name: Audit public tree
        run: python scripts/audit_public_tree.py .
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Lint
        run: ruff check .
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
