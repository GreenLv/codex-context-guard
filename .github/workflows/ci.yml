name: Windows host command probe (diagnosis only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    name: Three host-only commands / Windows Python 3.12
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1178b1426254654cff4ab84d1dd2dff33c6de3d6
          path: subject
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "uv==0.12.18"
      - name: Three bounded host commands, no product execution
        working-directory: subject
        shell: pwsh
        run: |
          uv run --locked --only-group test --python python python -B `
            ../diagnostic/tools/validation/host_powershell_probe.py `
            --subject-root . --output "$env:RUNNER_TEMP/host-command-probe.json" 2>$null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: host-command-probe
          path: |
            ${{ runner.temp }}/host-command-probe.json
            ${{ runner.temp }}/cg-host-command-probe-*/stages.jsonl
          if-no-files-found: warn
          retention-days: 7
