name: Windows module timeline (diagnosis only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    name: Unchanged host expression / complete redacted timeline
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1178b1426254654cff4ab84d1dd2dff33c6de3d6
          path: subject
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: One 30-second observation with original environment and owned cleanup
        shell: pwsh
        run: |
          python -B diagnostic/tools/validation/module_timeline_probe.py --subject-root subject --output "$env:RUNNER_TEMP/module-timeline.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: module-timeline
          path: |
            ${{ runner.temp }}/module-timeline.json
          if-no-files-found: error
          retention-days: 7
