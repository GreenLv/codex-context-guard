name: Original fixture on Windows 2022 (diagnosis only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    name: Original four-Hook fixture / Windows 2022 Python 3.12
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1178b1426254654cff4ab84d1dd2dff33c6de3d6
          path: subject
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "uv==0.12.18"
      - name: Unmodified original four-Hook fixture, no warmup
        working-directory: subject
        shell: pwsh
        run: |
          uv run --locked --only-group test --python python python -B -m pytest -q `
            tests/test_marketplace_artifact.py::MarketplaceArtifactTests::test_real_hook_does_not_generate_bytecode_or_break_full_parity `
            --junitxml="$env:RUNNER_TEMP/original-fixture-windows2022.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: original-fixture-windows2022
          path: |
            ${{ runner.temp }}/original-fixture-windows2022.xml
          if-no-files-found: warn
          retention-days: 7
